server {
    listen 80;
    server_name taiko-codex.rococo.dev;
    return 301 https://taiko-codex.rococo.dev$request_uri;
}

server {
    listen 443 ssl;
    server_name taiko-codex.rococo.dev;

    ssl_certificate     /etc/letsencrypt/rococo.dev/fullchain.cer;
    ssl_certificate_key /etc/letsencrypt/rococo.dev/rococo.dev.key;

    location / {
        proxy_pass http://172.18.0.1:3114;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
